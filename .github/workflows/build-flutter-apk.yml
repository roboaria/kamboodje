name: Build Flutter Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-flutter-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Create Flutter Platform Runners & Build Release APK
        working-directory: ./flutter_android_app
        run: |
          flutter create --platforms=android .
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Taraz-Flutter-Android-APK
          path: flutter_android_app/build/app/outputs/flutter-apk/app-release.apk
