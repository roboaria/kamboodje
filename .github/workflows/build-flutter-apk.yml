name: Build Taraz HTML App APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Build Standalone APK from Flutter App Folder
        run: |
          cd flutter_app
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/output_apk/Taraz-HTML-App.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taraz-HTML-Android-APK
          path: output_apk/Taraz-HTML-App.apk
